services:

  mysql:
    image: mysql:8.4
    container_name: student_management-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: student_management
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    ports:
      - "8001:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20


  redis:
    image: redis:7-alpine
    container_name: student_management-redis
    restart: unless-stopped

    ports:
      - "6380:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  app:
    build: .
    image: student-management-app
    container_name: student-management-container
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      DB_URL: jdbc:mysql://mysql:3306/student_management
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis

      JWT_SECRET: ${JWT_SECRET}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

    volumes:
      - ./uploads:/app/uploads

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  mysql_data: